<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulador de Física</title>
  <link rel="stylesheet" href="css/estilo.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <header>
    <h1 id="titulo">Simulador de Física</h1>
    <button id="voltar" hidden>Voltar ao menu</button>
  </header>

  <main id="menu"></main>

  <main id="sim" hidden>
    <div class="area">
      <canvas id="tela" width="800" height="450"></canvas>
      <div class="graf"><canvas id="grafico"></canvas></div>
    </div>
    <aside>
      <div class="botoes">
        <button id="play">Pausar</button>
        <button id="reset">Reiniciar</button>
      </div>
      <label>Velocidade da simulação <input type="range" id="vel" min="0.1" max="2" step="0.1" value="1"></label>
      <div id="params"></div>
      <pre id="info"></pre>
    </aside>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
