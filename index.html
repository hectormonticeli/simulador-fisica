<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulador de Física</title>
  <link rel="stylesheet" href="css/estilo.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <header>
    <h1 id="titulo">Simulador de Física</h1>
    <button id="voltar" hidden>Voltar ao menu</button>
  </header>

  <main id="menu"></main>

  <main id="sim" hidden>
    <canvas id="tela"></canvas>
    <div class="barra">
      <button id="play">Iniciar</button>
      <button id="reset">Reiniciar</button>
      <label>Velocidade <span id="velv">×1</span> <input type="range" id="vel" min="-1" max="1.3" step="0.05" value="0"></label>
    </div>
    <aside>
      <h2>Parâmetros</h2>
      <div id="params"></div>
      <div class="graf"><canvas id="grafico"></canvas></div>
    </aside>
    <pre id="info"></pre>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
